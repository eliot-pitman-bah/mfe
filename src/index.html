<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single-SPA MFE - Standalone</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f6f8fa;
    }
  </style>
</head>
<body>
  <div id="single-spa-application:@eliot-pitman/mfe"></div>
  
  <!-- SystemJS for module loading -->
  <script type="systemjs-importmap">
    {
      "imports": {
        "react": "https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js",
        "react-dom": "https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js",
        "single-spa": "https://cdn.jsdelivr.net/npm/single-spa@5.9.5/lib/system/single-spa.min.js",
        "@eliot-pitman/mfe": "http://localhost:9000/eliot-pitman-mfe.js"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/systemjs@6.14.1/dist/system.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/systemjs@6.14.1/dist/extras/amd.min.js"></script>
  
  <script>
    System.import('single-spa').then(function(singleSpa) {
      singleSpa.registerApplication({
        name: '@eliot-pitman/mfe',
        app: () => System.import('@eliot-pitman/mfe'),
        activeWhen: ['/']
      });
      
      singleSpa.start();
    });
  </script>
</body>
</html>
